<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#d71920" />
<title>Makro เกมจับคู่</title>
<style>
:root{--red:#e32636;--yellow:#ffbe23;--blue:#158bd2;--ink:#3a2d2a;--muted:#7f716c;--green:#67a83b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai","Segoe UI",sans-serif;background:linear-gradient(180deg,#dff4ff 0,#fff9e8 38%,#e9f7ce 100%);color:var(--ink);min-height:100vh}.wrap{width:min(100%,760px);margin:auto;padding:14px 12px 28px}.hero{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px #0002;background:#fff}.heroArt{height:260px;background:linear-gradient(135deg,#e32636,#ffbe23);display:flex;align-items:center;justify-content:center;color:white;font-weight:1000;font-size:54px;text-shadow:0 3px 0 #0002}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(255,255,255,.96) 100%);pointer-events:none}.hero-copy{position:absolute;left:0;right:0;bottom:14px;z-index:1;text-align:center;padding:0 12px}.hero-copy h1{margin:0;font-size:clamp(27px,7vw,46px);line-height:1;font-weight:1000;text-shadow:0 2px 0 #fff}.hero-copy p{margin:7px 0 0;font-weight:700}.panel{margin-top:14px;background:rgba(255,253,248,.96);border:1px solid #eadfcd;border-radius:22px;padding:14px;box-shadow:0 8px 20px #0001}.name label{font-size:13px;font-weight:800;display:block;margin-bottom:5px}.name input{width:100%;min-height:46px;border:1px solid #dfd2c2;border-radius:13px;padding:0 12px;font:inherit;font-size:16px;background:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#fff;border:1px solid #e8ddcf;border-radius:15px;padding:9px 5px;text-align:center}.stat small{display:block;color:var(--muted);font-weight:700;font-size:12px}.stat strong{font-size:22px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.card{position:relative;aspect-ratio:1/1;border:0;padding:0;background:transparent;perspective:800px;touch-action:manipulation}.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .36s ease}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 3px 9px #0002;border:3px solid #fff}.back{background:linear-gradient(145deg,#f33f4c,#cf1725);color:#fff;flex-direction:column;font-weight:1000}.back .brand{font-size:clamp(14px,4.2vw,25px);line-height:1}.back svg{width:33%;margin-top:7px}.front{transform:rotateY(180deg);background:white;padding:8px}.front svg{width:88%;height:88%}.matched .front{background:#edf8e5;border-color:#8fc661}.message{text-align:center;font-weight:850;min-height:26px;margin-top:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.btn{border:0;border-radius:14px;min-height:48px;font:inherit;font-size:16px;font-weight:900;color:white;padding:0 12px;touch-action:manipulation}.restart{background:var(--blue)}.shuffle{background:#f2a20d}.history h2{font-size:19px;margin:0 0 10px}.best{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.best .box{background:#fff6cf;border:1px solid #f0d166;border-radius:14px;padding:10px;text-align:center}.best small{display:block;color:#78662c;font-weight:750}.best strong{font-size:20px}.table-wrap{overflow:auto;border:1px solid #eadfcd;border-radius:14px;background:white}table{border-collapse:collapse;width:100%;min-width:520px}th,td{padding:9px 10px;border-bottom:1px solid #eee3d7;text-align:left;font-size:13px}th{background:#fff7e9;position:sticky;top:0}.empty{text-align:center;color:var(--muted);padding:18px}.clear{margin-top:10px;background:#6d625d;width:100%}.note{font-size:12px;color:var(--muted);margin:10px 2px 0;line-height:1.5}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.modal-card{background:white;border-radius:24px;padding:20px;width:min(100%,420px);text-align:center;box-shadow:0 20px 50px #0004}.modal-card h2{font-size:30px;margin:0}.score{font-size:18px;margin:10px 0}.modal-card .btn{width:100%;margin-top:8px}.share{background:var(--green)}@media(max-width:380px){.wrap{padding-left:8px;padding-right:8px}.panel{padding:10px}.board{gap:5px}.face{border-radius:12px;border-width:2px}.stats{gap:5px}.stat strong{font-size:19px}}@media(prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<main class="wrap"><a href="../" style="display:inline-block;padding:12px 0;color:#b9101b;font-weight:700">← เลือกเกมอื่น</a>
<section class="hero"><div class="heroArt">makro</div><div class="hero-copy"><h1>เกมจับคู่</h1><p>พลิกการ์ด หาคู่ภาพที่เหมือนกันให้ครบ 8 คู่</p></div></section>
<section class="panel"><div class="name"><label for="playerName">ชื่อผู้เล่น</label><input id="playerName" maxlength="30" autocomplete="name" placeholder="กรอกชื่อก่อนเริ่มเล่น" /></div><div class="stats"><div class="stat"><small>⏱ เวลา</small><strong id="time">00:00</strong></div><div class="stat"><small>⭐ จำนวนครั้ง</small><strong id="moves">0</strong></div><div class="stat"><small>🏁 จับคู่แล้ว</small><strong><span id="pairs">0</span>/8</strong></div></div><div id="board" class="board"></div><div id="message" class="message" aria-live="polite">กรอกชื่อแล้วแตะการ์ดเพื่อเริ่มเล่น ✨</div><div class="actions"><button id="restart" class="btn restart" type="button">↻ เริ่มใหม่</button><button id="shuffle" class="btn shuffle" type="button">🔀 สลับการ์ด</button></div></section>
<section class="panel history"><h2>🏆 สถิติของเครื่องนี้</h2><div class="best"><div class="box"><small>เวลาที่ดีที่สุด</small><strong id="bestTime">—</strong></div><div class="box"><small>จำนวนครั้งน้อยที่สุด</small><strong id="bestMoves">—</strong></div></div><div id="historyWrap"></div><button id="clearHistory" class="btn clear" type="button">ล้างประวัติสถิติ</button><p class="note">สถิติจะบันทึกไว้ในเบราว์เซอร์ของอุปกรณ์นี้อัตโนมัติ</p></section>
</main>
<div id="winModal" class="modal" role="dialog" aria-modal="true"><div class="modal-card"><h2>🎉 สำเร็จ!</h2><div id="winText" class="score"></div><button id="playAgain" class="btn restart" type="button">เล่นอีกครั้ง</button><button id="shareBtn" class="btn share" type="button">แชร์เกม</button><button id="closeModal" class="btn clear" type="button">ดูสถิติ</button></div></div>
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true"><defs>
<symbol id="apple" viewBox="0 0 100 100"><path d="M50 29c-7-13 4-23 15-22-1 11-7 17-15 19" fill="#58a848"/><path d="M50 30c-23-13-38 4-35 25 3 23 20 39 35 32 15 7 32-9 35-32 3-21-12-38-35-25Z" fill="#ed3945"/><circle cx="38" cy="53" r="4" fill="#36252a"/><circle cx="62" cy="53" r="4" fill="#36252a"/><path d="M40 67q10 8 20 0" fill="none" stroke="#62282e" stroke-width="4" stroke-linecap="round"/></symbol>
<symbol id="milk" viewBox="0 0 100 100"><path d="M30 18h31l12 15v51H26V33Z" fill="#eef8ff" stroke="#3986bd" stroke-width="4"/><path d="M30 18h31l12 15H41Z" fill="#b8ddf5"/><rect x="34" y="44" width="31" height="25" rx="5" fill="#4e9fd4"/><circle cx="43" cy="56" r="3" fill="#173f59"/><circle cx="56" cy="56" r="3" fill="#173f59"/></symbol>
<symbol id="cheese" viewBox="0 0 100 100"><path d="M14 57 54 24l33 20v39H14Z" fill="#ffd54a" stroke="#bd861b" stroke-width="4"/><circle cx="49" cy="51" r="7" fill="#e8a62c"/><circle cx="72" cy="67" r="6" fill="#e8a62c"/><circle cx="33" cy="70" r="5" fill="#e8a62c"/></symbol>
<symbol id="bread" viewBox="0 0 100 100"><path d="M22 41c0-16 17-27 29-16 12-11 30 1 29 17v39H20Z" fill="#e6a85d" stroke="#9b6231" stroke-width="4"/><path d="M31 38q6-10 12 0M53 35q6-10 12 0" fill="none" stroke="#fff0ca" stroke-width="5" stroke-linecap="round"/><circle cx="39" cy="59" r="4"/><circle cx="61" cy="59" r="4"/></symbol>
<symbol id="carrot" viewBox="0 0 100 100"><path d="M49 34 78 37 50 88 25 40Z" fill="#f5822a" stroke="#b74f1b" stroke-width="4"/><path d="M45 35C31 25 35 13 42 9c7 8 10 15 8 25M54 34c4-15 13-19 20-15-2 10-8 16-20 20" fill="#59a84c" stroke="#34813c" stroke-width="4" stroke-linecap="round"/></symbol>
<symbol id="fish" viewBox="0 0 100 100"><path d="M21 51c15-24 46-24 60 0-14 24-45 24-60 0Z" fill="#63c8dd" stroke="#277f9c" stroke-width="4"/><path d="M22 51 8 36v30Z" fill="#48adc5" stroke="#277f9c" stroke-width="4"/><circle cx="66" cy="45" r="4"/></symbol>
<symbol id="cart" viewBox="0 0 100 100"><path d="M19 27h10l9 39h38l10-29H34" fill="#ef3340" stroke="#a81c25" stroke-width="4" stroke-linejoin="round"/><path d="M40 45h37M45 55h29M53 38v27M67 38v27" stroke="#fff" stroke-width="3"/><circle cx="45" cy="77" r="6" fill="#333"/><circle cx="72" cy="77" r="6" fill="#333"/></symbol>
<symbol id="gift" viewBox="0 0 100 100"><rect x="18" y="39" width="64" height="48" rx="6" fill="#ef3340" stroke="#a71e28" stroke-width="4"/><rect x="14" y="31" width="72" height="18" rx="5" fill="#ff6873"/><path d="M50 32v55" stroke="#ffd54a" stroke-width="9"/><path d="M50 31c-4-17-23-17-21-5 1 8 13 8 21 5Zm0 0c4-17 23-17 21-5-1 8-13 8-21 5Z" fill="#ffd54a" stroke="#bd8a16" stroke-width="3"/></symbol>
</defs></svg>

</body></html>
