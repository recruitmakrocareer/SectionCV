<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Makro เกมจับคู่</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:linear-gradient(#dff4ff,#fff8e8 45%,#e6f6cc);color:#3b302c;min-height:100vh}.w{max-width:680px;margin:auto;padding:14px}.hero{text-align:center;padding:18px 10px}.brand{font-size:42px;font-weight:1000;color:#e32636}.hero h1{margin:4px 0;font-size:34px}.hero p{margin:0;color:#766b66;font-weight:700}.panel{background:#fffdf9;border:1px solid #e7d9c8;border-radius:22px;padding:14px;box-shadow:0 8px 22px #0001}label{font-weight:800;font-size:13px}input{width:100%;height:46px;border:1px solid #d9ccbc;border-radius:13px;padding:0 12px;font:inherit;font-size:16px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}.s{background:white;border:1px solid #eadfce;border-radius:14px;text-align:center;padding:8px 3px}.s small{display:block;color:#7d716b}.s b{font-size:20px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.card{aspect-ratio:1;border:0;padding:0;background:transparent;perspective:700px;touch-action:manipulation}.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:.35s}.card.open .in,.card.ok .in{transform:rotateY(180deg)}.f{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border:2px solid white;box-shadow:0 3px 8px #0002}.back{background:linear-gradient(145deg,#f43e4d,#cc1524);color:white;flex-direction:column;font-weight:1000}.back span:first-child{font-size:clamp(13px,4.5vw,24px)}.back span:last-child{font-size:clamp(18px,6vw,34px)}.front{transform:rotateY(180deg);background:white;font-size:clamp(34px,10vw,60px)}.ok .front{background:#edf8e6;border-color:#83ba59}.msg{text-align:center;font-weight:800;min-height:26px;margin:10px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{min-height:48px;border:0;border-radius:14px;color:white;font:inherit;font-weight:900;font-size:16px}.blue{background:#168bd2}.orange{background:#f0a009}.hist{margin-top:14px}.best{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#fff5c8;border:1px solid #efd268;border-radius:13px;padding:9px;text-align:center}.box small{display:block}.box b{font-size:19px}.list{margin-top:10px;background:white;border:1px solid #eadfce;border-radius:13px;overflow:hidden}.row{display:grid;grid-template-columns:1.4fr .8fr .7fr;gap:6px;padding:9px;border-bottom:1px solid #eee3d8;font-size:13px}.row.head{font-weight:900;background:#fff7e9}.empty{text-align:center;padding:15px;color:#82756f}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.pop{width:min(100%,400px);background:white;border-radius:22px;padding:20px;text-align:center}.pop h2{margin:0;font-size:30px}.pop .btn{width:100%;margin-top:8px}@media(max-width:360px){.w{padding:8px}.panel{padding:10px}.board{gap:5px}.f{border-radius:11px}}</style></head><body><main class="w"><section class="hero"><div class="brand">makro</div><h1>เกมจับคู่ 🧠</h1><p>พลิกการ์ด หาคู่ที่เหมือนกันให้ครบ 8 คู่</p></section><section class="panel"><label>ชื่อผู้เล่น<input id="name" maxlength="30" placeholder="กรอกชื่อก่อนเริ่มเล่น"></label><div class="stats"><div class="s"><small>⏱ เวลา</small><b id="time">00:00</b></div><div class="s"><small>⭐ ครั้ง</small><b id="moves">0</b></div><div class="s"><small>🏁 คู่</small><b><span id="pairs">0</span>/8</b></div></div><div id="board" class="board"></div><div id="msg" class="msg">กรอกชื่อแล้วแตะการ์ดเพื่อเริ่ม ✨</div><div class="actions"><button id="reset" class="btn blue">↻ เริ่มใหม่</button><button id="shuffle" class="btn orange">🔀 สลับการ์ด</button></div></section><section class="panel hist"><h3>🏆 สถิติของเครื่องนี้</h3><div class="best"><div class="box"><small>เวลาที่ดีที่สุด</small><b id="bt">—</b></div><div class="box"><small>ครั้งน้อยที่สุด</small><b id="bm">—</b></div></div><div id="history"></div></section></main><div id="modal" class="modal"><div class="pop"><h2>🎉 สำเร็จ!</h2><p id="win"></p><button id="again" class="btn blue">เล่นอีกครั้ง</button><button id="share" class="btn orange">แชร์เกม</button></div></div><script>(()=>{const I=['🍎','🥛','🧀','🍞','🥕','🐟','🛒','🎁'],K='makro-memory-stats-v2',B=document.querySelector('#board'),T=document.querySelector('#time'),M=document.querySelector('#moves'),P=document.querySelector('#pairs'),G=document.querySelector('#msg'),N=document.querySelector('#name'),MO=document.querySelector('#modal');let d=[],a=null,b=null,lock=false,m=0,p=0,start=0,timer=0;const sh=x=>{for(let i=x.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x},fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'),load=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}},save=x=>localStorage.setItem(K,JSON.stringify(x.slice(0,30)));function hist(){let s=load(),h=document.querySelector('#history');if(!s.length){document.querySelector('#bt').textContent='—';document.querySelector('#bm').textContent='—';h.innerHTML='<div class="empty">ยังไม่มีสถิติ</div>';return}document.querySelector('#bt').textContent=fmt(Math.min(...s.map(x=>x.sec)));document.querySelector('#bm').textContent=Math.min(...s.map(x=>x.moves))+' ครั้ง';h.innerHTML='<div class="list"><div class="row head"><span>ผู้เล่น</span><span>เวลา</span><span>ครั้ง</span></div>'+s.slice(0,10).map(x=>`<div class="row"><span>${String(x.name).replace(/[<>]/g,'')}</span><span>${fmt(x.sec)}</span><span>${x.moves}</span></div>`).join('')+'</div>'}function tick(){if(start)T.textContent=fmt(Math.floor((Date.now()-start)/1000))}function render(){B.innerHTML='';d.forEach((v,i)=>{let c=document.createElement('button');c.className='card';c.type='button';c.dataset.v=v;c.innerHTML=`<span class="in"><span class="f back"><span>makro</span><span>🛒</span></span><span class="f front">${v}</span></span>`;B.appendChild(c)})}function reset(){clearInterval(timer);timer=0;start=0;a=b=null;lock=false;m=p=0;T.textContent='00:00';M.textContent='0';P.textContent='0';G.textContent='กรอกชื่อแล้วแตะการ์ดเพื่อเริ่ม ✨';d=sh([...I,...I]);render();MO.classList.remove('show')}function choose(c){if(lock||c===a||c.classList.contains('ok'))return;if(!N.value.trim()){N.focus();G.textContent='กรุณากรอกชื่อผู้เล่นก่อนครับ';return}if(!start){start=Date.now();timer=setInterval(tick,500)}c.classList.add('open');if(!a){a=c;G.textContent='เลือกอีกใบเพื่อจับคู่';return}b=c;m++;M.textContent=m;lock=true;if(a.dataset.v===b.dataset.v){a.classList.add('ok');b.classList.add('ok');p++;P.textContent=p;a=b=null;lock=false;G.textContent='จับคู่สำเร็จ! 🎉';if(p===8){clearInterval(timer);tick();let sec=Math.max(1,Math.floor((Date.now()-start)/1000)),name=N.value.trim();let s=load();s.unshift({name,sec,moves:m,date:Date.now()});save(s);localStorage.setItem('makro-memory-name',name);hist();document.querySelector('#win').textContent=`${name} ใช้เวลา ${fmt(sec)} เปิด ${m} ครั้ง`;MO.classList.add('show')}}else{G.textContent='ยังไม่เหมือนกัน ลองใหม่ 💪';setTimeout(()=>{a.classList.remove('open');b.classList.remove('open');a=b=null;lock=false},700)}}B.addEventListener('click',e=>{let c=e.target.closest('.card');if(c)choose(c)});document.querySelector('#reset').onclick=reset;document.querySelector('#shuffle').onclick=reset;document.querySelector('#again').onclick=reset;document.querySelector('#share').onclick=async()=>{let x={title:'Makro เกมจับคู่',text:'มาลองเล่น Makro เกมจับคู่กัน!',url:location.href};try{navigator.share?await navigator.share(x):prompt('คัดลอกลิงก์นี้',location.href)}catch{}};N.value=localStorage.getItem('makro-memory-name')||'';hist();reset()})();</script></body></html>
